apiVersion: v1
kind: Service
metadata:
  name: {{ include "linkerd-max-header-repro.fullname" . }}-server
  labels:
    {{- include "linkerd-max-header-repro.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    {{- include "linkerd-max-header-repro.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.server.port }}
      targetPort: http
